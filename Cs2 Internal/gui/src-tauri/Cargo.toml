[package]
name = "velora-gui"
version = "0.1.0"
description = "DeltaEAC desktop settings companion"
edition = "2021"

[lib]
name = "velora_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["standalone"]
standalone = ["dep:tauri-plugin-single-instance"]
embedded = ["dep:tauri-runtime-wry", "tauri-runtime-wry/embedded-host"]
custom-protocol = ["tauri/custom-protocol"]
bridge-test = []

[[bin]]
name = "velora-gui"
path = "src/main.rs"
required-features = ["standalone"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt-multi-thread", "macros"] }

[target.'cfg(windows)'.dependencies]
tauri-runtime-wry = { version = "=2.12.1", optional = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[patch.crates-io]
tauri-runtime-wry = { path = "vendor/tauri-runtime-wry" }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "debuginfo"
